name: Update FCAD sample index

on:
  push:
    branches: [main]
    paths:
      - 'samples/*.json'
      - '!samples/index.json'
      - '.github/workflows/update-sample-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fcad-sample-index-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Regenerate and commit the sample index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git switch --detach FETCH_HEAD

            python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          folder = Path("samples")
          index = folder / "index.json"
          # The previous 700 mm demo was deliberately removed from the menu.
          excluded = {"index.json", "plate_width_700.json"}

          names = set()
          for path in folder.iterdir():
              if (path.name in excluded or path.is_symlink() or not path.is_file()
                      or not re.fullmatch(r"[A-Za-z0-9_-]+\.json", path.name)):
                  continue
              try:
                  sample = json.loads(path.read_text(encoding="utf-8"))
              except (ValueError, OSError) as error:
                  print(f"Skipping {path.name}: {error}")
                  continue

              drawing = sample.get("drawing") if isinstance(sample, dict) else None
              if (isinstance(drawing, dict)
                      and all(isinstance(sample.get(key), str) for key in ("title", "purpose"))
                      and all(isinstance(drawing.get(key), list) for key in ("lines", "circles", "arcs"))):
                  names.add(path.name)

          # Keep the order of published lessons, and append new ones by filename.
          try:
              current = json.loads(index.read_text(encoding="utf-8"))
          except (FileNotFoundError, ValueError):
              current = {}
          entries = current.get("samples", []) if isinstance(current, dict) else []
          ordered = []
          if isinstance(entries, list):
              for entry in entries:
                  name = entry.get("file") if isinstance(entry, dict) else entry
                  if isinstance(name, str) and name in names:
                      ordered.append(name)
                      names.remove(name)

          ordered.extend(sorted(names))
          index.write_text(json.dumps({"samples": ordered}, indent=2) + "\n", encoding="utf-8")
          PY

            git add -- samples/index.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Update FCAD sample index"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
          done

          echo "Could not push the generated sample index." >&2
          exit 1
